<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <title>Random Password Generator</title>



    <link rel="stylesheet" href="style.css">

</head>



<body>



    <main class="main-container">



        <section class="container">



            <div class="text-container">

                <h1>Generate a</h1>

                <h1 class="random-password">random password</h1>



                <p class="paragraph-text">

                    Never use an insecure password again.

                </p>

            </div>



            <button class="generate-btn" id="target-button">

                Generate passwords

            </button>



            <div class="password-display">



                <button

                    class="password-output placeholder"

                    id="first-password"

                    data-placeholder="Password 1"

                    aria-label="First generated password">Password 1

                </button>



                <button

                    class="password-output placeholder"

                    id="second-password"

                    data-placeholder="Password 2"

                    aria-label="Second generated password">Password 2

                </button>



            </div>



        </section>



    </main>



    <script src="script.js"></script>



</body>



</html>
